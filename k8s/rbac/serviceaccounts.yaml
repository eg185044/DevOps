# One ServiceAccount per Deployment (assignment 3 bonus). None of them are bound
# to any Kubernetes RBAC Role by default - see role.yaml / rolebinding.yaml for why.
# The eks.amazonaws.com/role-arn annotations are IRSA: on EKS, the EKS Pod Identity
# webhook injects short-lived AWS credentials scoped to that IAM role into any pod
# using this ServiceAccount, so app code never carries a static AWS access key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: devops-app
  labels: { app: frontend, tier: frontend }
  # No IRSA annotation: nginx never talks to AWS APIs directly.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: devops-app
  labels: { app: backend, tier: backend }
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ME_ACCOUNT_ID:role/erez-cv-devops-backend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: devops-app
  labels: { app: worker, tier: worker }
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ME_ACCOUNT_ID:role/erez-cv-devops-worker-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: devops-app
  labels: { app: redis-cache, tier: cache }
  # No IRSA annotation: redis never talks to AWS APIs.
automountServiceAccountToken: false
---
# Not attached to any workload. Meant to be used ad-hoc for troubleshooting,
# e.g. `kubectl run debug --rm -it --image=busybox --serviceaccount=diagnostics-sa -n devops-app -- sh`
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostics-sa
  namespace: devops-app
  labels: { app: diagnostics, tier: ops }
