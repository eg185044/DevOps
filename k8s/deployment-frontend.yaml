# Frontend / nginx / API gateway - the ONLY component exposed via ingress.yaml.
# Replaces the EC2 + Ansible nginx role; static CV site + reverse proxy to
# backend-svc/worker-svc, now baked into the erez-cv-devops-frontend image
# (see app/frontend/Dockerfile) instead of an Ansible template on a VM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-app
  labels: { app: frontend, tier: frontend, env: production }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels: { app: frontend, tier: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: frontend, env: production }
    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      # HA: never let two frontend replicas land on the same node.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: frontend, tier: frontend }
      # Optional: lets frontend Pods use a dedicated node group provisioned for
      # traffic spikes (tainted `dedicated=frontend-pool:NoSchedule`), without
      # requiring it - no matching nodeAffinity, so it schedules anywhere by default.
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "frontend-pool"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: REPLACE_ME_REGISTRY/erez-cv-devops-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 12 # 12 x 5s = up to 60s to come up before liveness kicks in
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # readOnlyRootFilesystem: true means nginx needs explicit writable
            # dirs for its cache, pidfile and the client body temp path.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            # Local, ephemeral request cache. Gone on every Pod restart/reschedule
            # by design (emptyDir) - never a source of truth, only a speed-up.
            - name: request-cache
              mountPath: /tmp/cache
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: request-cache
          emptyDir: {}
