apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cv-platform.fullname" . }}-frontend-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cv-platform.fullname" . }}-backend-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.backendIrsaRoleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cv-platform.fullname" . }}-worker-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.workerIrsaRoleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cv-platform.fullname" . }}-redis-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "redis-cache") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cv-platform.fullname" . }}-diagnostics-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "diagnostics") | nindent 4 }}
{{- if .Values.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cv-platform.fullname" . }}-namespace-viewer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cv-platform.fullname" . }}-diagnostics-view-binding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cv-platform.fullname" . }}-diagnostics-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "cv-platform.fullname" . }}-namespace-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
