apiVersion: v1
kind: Service
metadata:
  name: {{ include "cv-platform.fullname" . }}-frontend-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cv-platform.fullname" . }}-backend-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cv-platform.fullname" . }}-worker-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 4 }}
  ports:
    - name: http
      port: 5002
      targetPort: http
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cv-platform.fullname" . }}-redis-svc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "redis-cache") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "redis-cache") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
