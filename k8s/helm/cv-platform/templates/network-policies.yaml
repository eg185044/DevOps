{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-allow-ingress-to-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-allow-backend-from-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-allow-worker-from-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5002
---
# Lets the observability namespace's Prometheus Pod scrape backend/worker's
# app port (they serve /metrics on the same port as the rest of their API -
# see app/backend/app.py, app/worker/worker.py) and frontend's DEDICATED
# metrics port 9113 (the nginx-prometheus-exporter sidecar - never nginx's
# own port 8080, so this can never be used to reach the site itself).
# See observability/README.md "Discovery, labels & cardinality" for why
# this is namespace-scoped rather than a narrower per-Pod rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-allow-observability-scrape
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["backend", "worker", "frontend"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 5002
        - protocol: TCP
          port: 9113
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cv-platform.fullname" . }}-allow-redis-from-backend-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "redis-cache") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "redis-cache") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "cv-platform.componentSelectorLabels" (dict "context" . "component" "cache-cleanup") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
