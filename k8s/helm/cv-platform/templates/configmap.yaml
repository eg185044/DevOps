apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cv-platform.fullname" . }}-app-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
data:
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  CV_FILE_NAME: {{ .Values.config.cvFileName | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  MAX_CONNECTIONS: {{ .Values.config.maxConnections | quote }}
  CACHE_TTL: {{ .Values.config.cacheTtl | quote }}
  S3_BUCKET_NAME: {{ .Values.config.s3BucketName | quote }}
  SNS_TOPIC_ARN: {{ .Values.config.snsTopicArn | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cv-platform.fullname" . }}-frontend-nginx-conf
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        access_log /var/log/nginx/cv-platform-access.log;
        error_log  /var/log/nginx/cv-platform-error.log;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 "frontend nginx ok\n";
        }

        location /api/ {
            proxy_pass http://{{ include "cv-platform.fullname" . }}-backend-svc.{{ .Values.namespace }}.svc.cluster.local:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /worker/ {
            proxy_pass http://{{ include "cv-platform.fullname" . }}-worker-svc.{{ .Values.namespace }}.svc.cluster.local:5002/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
