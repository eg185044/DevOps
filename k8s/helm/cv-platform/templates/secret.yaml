{{- if .Values.secrets.create }}
# Set secrets.create=false and pre-create this Secret with kubectl instead if
# you don't want DB credentials passed through `helm --set` / values files at
# all (they'd otherwise land in `helm get values` / release history).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cv-platform.fullname" . }}-db-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cv-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: {{ .Values.secrets.dbHost | quote }}
  DB_USERNAME: {{ .Values.secrets.dbUsername | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
{{- end }}
