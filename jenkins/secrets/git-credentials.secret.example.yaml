# EXAMPLE ONLY - only needed if the Git repository is PRIVATE. If it is
# public, leave GIT_CREDENTIALS_ID empty (the default in
# jenkins/helm/values.yaml) and skip this file entirely.
#
# This Secret is picked up as a Jenkins credential automatically by the
# `kubernetes-credentials-provider` plugin (see jenkins/plugins.txt) once
# it carries the two labels below - no manual "Add Credential" click in
# the UI. Its Kubernetes Secret name becomes the Jenkins credential ID,
# so set GIT_CREDENTIALS_ID (in jenkins/helm/values.yaml's containerEnv,
# or your real values-secrets.yaml override) to match `metadata.name`.
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: jenkins
  labels:
    jenkins.io/credentials-type: "usernamePassword"
  annotations:
    jenkins.io/credentials-description: "Read access to this project's Git repository (personal access token, not a real password)"
type: Opaque
stringData:
  username: "REPLACE_ME_GIT_USERNAME"
  password: "REPLACE_ME_GIT_PERSONAL_ACCESS_TOKEN"
