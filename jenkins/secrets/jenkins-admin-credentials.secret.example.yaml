# EXAMPLE ONLY - never apply this file as-is and never commit a copy with
# real values. See jenkins/README.md "Creating Jenkins secrets" for the
# exact `kubectl create secret` command that creates the real one directly
# in the cluster (no real-valued YAML ever touches disk or Git).
#
# Consumed by: jenkins/helm/values.yaml -> controller.containerEnv
# (ADMIN_USER / ADMIN_PASSWORD, via secretKeyRef) which JCasC then reads
# into jenkins.yaml's securityRealm.local.users entry.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-credentials
  namespace: jenkins
type: Opaque
stringData:
  admin-user: "REPLACE_ME_ADMIN_USERNAME"
  admin-password: "REPLACE_ME_STRONG_RANDOM_PASSWORD"
