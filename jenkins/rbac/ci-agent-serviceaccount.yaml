# ServiceAccount for CI agent Pods (build/test/scan/push). It is granted
# ZERO Kubernetes RBAC permissions - no Role/RoleBinding targets it anywhere
# in this repo, because the CI Pipeline never needs to talk to the
# Kubernetes API (see jenkins/README.md - "Pipeline separation").
#
# It exists purely as an IRSA identity: the annotation below lets EKS's Pod
# Identity webhook inject short-lived AWS credentials scoped to an IAM role
# that only allows `ecr:*` push actions on this project's repositories, so
# kaniko can authenticate to ECR without any static AWS access key ever
# being stored in Jenkins. Replace the placeholder role ARN with the real
# one created for this project (see jenkins/README.md - IAM policy JSON).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-agent
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ME_ACCOUNT_ID:role/erez-cv-devops-jenkins-ci-ecr-push"
automountServiceAccountToken: true
