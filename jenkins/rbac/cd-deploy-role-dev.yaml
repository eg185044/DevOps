# Identical to cd-deploy-role.yaml but for the `devops-app-dev` namespace -
# k8s/helm/cv-platform/values-dev.yaml deploys into a namespace SEPARATE
# from prod (see that file's own comment: "so cv-platform-dev and
# cv-platform-prod can both exist on the same cluster at once"). This is
# the "if dev/staging environments exist, define separate namespaces and
# permissions" requirement - one Role per environment namespace, both
# bound to the SAME jenkins-cd-deploy ServiceAccount, so a single CD
# pipeline can deploy to either, but never to any other namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-deployer
  namespace: devops-app-dev
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: cd-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
