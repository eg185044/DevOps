# ServiceAccount used ONLY by the Jenkins controller Pod.
# It never touches the application cluster - it only needs permission to
# create/manage the short-lived agent Pods it launches inside the `jenkins`
# namespace (via the Kubernetes plugin). It has zero permissions in
# `devops-app` - deploy permissions live on jenkins-cd-deploy instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-controller
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
automountServiceAccountToken: true
