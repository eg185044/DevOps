# ServiceAccount for CD agent Pods (deploy/verify/smoke-test). It lives in
# the `jenkins` namespace (so the Kubernetes plugin can launch Pods under
# it) but its actual Kubernetes permissions are granted in `devops-app`
# via a namespaced Role + cross-namespace RoleBinding - see
# jenkins/rbac/cd-deploy-role.yaml. It has NO permissions in `jenkins`
# itself and NO cluster-scoped permissions anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-cd-deploy
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: cd-agent
automountServiceAccountToken: true
