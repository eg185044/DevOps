# Allows reaching the controller's web UI/API (port 8080) only from:
#   - the ingress-nginx controller's namespace (only relevant if you flip
#     jenkins/helm/values.yaml's controller.ingress.enabled to true), and
#   - other pods inside the `jenkins` namespace itself (agents calling
#     back to the REST API, health checks run from a diagnostics pod).
#
# NOT included: any rule allowing traffic from the whole cluster or from
# 0.0.0.0/0 - there is deliberately no path to the UI from the public
# internet except through the ingress-nginx namespace above, and that
# path itself only exists when the Ingress is explicitly turned on.
#
# Note: `kubectl port-forward` (this project's default access method - see
# jenkins/README.md) does NOT go through the Service/pod network path this
# policy governs, so it keeps working even with ingress.enabled left
# false and no other rule present.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-ui-ingress
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: "jenkins-controller"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
      ports:
        - protocol: TCP
          port: 8080
