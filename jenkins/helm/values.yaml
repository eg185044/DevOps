# Values for the OFFICIAL Jenkins Helm chart (repo: https://charts.jenkins.io,
# chart: jenkins/jenkins). Installed exactly as:
#
#   helm repo add jenkins https://charts.jenkins.io
#   helm repo update
#   helm upgrade --install jenkins-controller jenkins/jenkins \
#     --version 5.9.53 \
#     --namespace jenkins --create-namespace \
#     -f jenkins/helm/values.yaml \
#     --set-file controller.JCasC.configScripts.main=jenkins/jcasc/jenkins.yaml
#
# (the exact command, with every flag explained, lives in
# jenkins/scripts/install-jenkins.sh - do not hand-type this).
#
# Chart version 5.9.53 (app version 2.568.2) is pinned deliberately (never
# "latest") - re-verify the current chart version with `helm search repo
# jenkins/jenkins --versions` before a real deploy and update this
# comment, controller.image.tag below, jenkins/plugins.txt (re-resolved
# against the new core - see that file's header), and install-jenkins.sh
# together. This exact pin was installed and brought to a Ready state
# against a real cluster while building this project (see
# jenkins/README.md "What was and wasn't run live") - an earlier,
# untested pin (chart 5.7.15 / core 2.479.3) failed at container startup
# because current plugin releases require a newer core; this one doesn't.
#
# Every key path below was verified against the real chart with
# `helm show values jenkins/jenkins --version 5.9.53` - two top-level keys
# (`serviceAccount`, `persistence`) live OUTSIDE `controller:` in this
# chart, not nested under it; get that wrong and Helm refuses to install
# ("exists and cannot be imported into the current release") because it
# tries to adopt the ServiceAccount this project pre-creates in
# jenkins/rbac/. Confirmed against a real cluster, not just read from docs.

controller:
  # Pinned image - never "latest". Confirmed to actually exist and pull
  # (`docker pull jenkins/jenkins:2.568.2-jdk21`) and to reach Ready
  # against a real cluster before being committed - re-check
  # https://www.jenkins.io/download/ before a future deploy.
  image:
    repository: "jenkins/jenkins"
    tag: "2.568.2-jdk21"
  imagePullPolicy: IfNotPresent

  # We manage our own admin Secret + securityRealm via JCasC (see
  # jenkins/jcasc/jenkins.yaml) - tell the chart not to also generate its
  # own random-password admin Secret, which JCasC's own default config
  # would otherwise still create (unused, but confusing to find later).
  admin:
    createSecret: false

  # Non-root by default - the official image already runs as uid 1000
  # (the "jenkins" user); this just makes that explicit and enforced.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false   # JENKINS_HOME itself must stay writable; nothing else is
    capabilities:
      drop: ["ALL"]
  podSecurityContextOverride:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }

  # controller.installPlugins mirrors jenkins/plugins.txt exactly - keep the
  # two in sync (jenkins/scripts/configure-jenkins.sh checks this before
  # every install/upgrade and fails loudly on drift).
  installPlugins:
    - "configuration-as-code:2117.vc05a_0b_e6b_f4e"
    - "configuration-as-code-support:1.18"
    - "kubernetes:4540.v612369217f87"
    # kubernetes-credentials-provider intentionally omitted - see the long
    # comment in jenkins/plugins.txt (crashed the controller against a
    # real cluster; not needed given controller.additionalExistingSecrets below).
    - "workflow-aggregator:608.v67378e9d3db_1"
    - "git:5.10.1"
    - "git-client:6.6.1"
    - "scm-api:728.vc30dcf7a_0df5"
    - "pipeline-utility-steps:3.810.va_7672d206740"
    - "pipeline-stage-view:2.41"
    - "durable-task:686.v80ff80875b_82"
    - "job-dsl:3654.vdf58f53e2d15"
    - "github:1.47.0"
    - "github-branch-source:1983.vfa_27ed961853"
    - "credentials:1511.v2e3cb_0008ef0"
    - "credentials-binding:728.v902a_273b_8947"
    - "plain-credentials:199.v9f8e1f741799"
    - "junit:1418.v67a_81935603c"
    - "timestamper:1.30"
    - "ws-cleanup:0.49"
    - "build-timeout:1.41"
    - "ansicolor:542.v03d235fee02d"

  # Trusted Groovy init script (runs unsandboxed at controller startup,
  # unlike JCasC) - disables Job DSL's "approve every script change"
  # requirement. Confirmed against a real cluster that the equivalent
  # JCasC `unclassified` key does NOT exist for the installed job-dsl
  # plugin version (ConfigurationAsCode.init throws
  # UnknownAttributesException listing every valid `unclassified`
  # attribute - "globalJobDslSecurityConfiguration" isn't one of them),
  # so this is the one setting in this project NOT expressed via JCasC.
  # Safe here because the only Job DSL script this controller ever runs
  # is jenkins/jobs/seed.groovy, checked out from the one Git URL the
  # seed job is configured with (GIT_REPO_URL) - never arbitrary or
  # user-submitted DSL.
  initScripts:
    disable-job-dsl-script-security: |
      import javaposse.jobdsl.plugin.GlobalJobDslSecurityConfiguration
      import jenkins.model.GlobalConfiguration
      def cfg = GlobalConfiguration.all().get(GlobalJobDslSecurityConfiguration)
      if (cfg != null && cfg.useScriptSecurity) {
        cfg.useScriptSecurity = false
        cfg.save()
      }

  # JCasC content is supplied at install time via
  #   --set-file controller.JCasC.configScripts.main=jenkins/jcasc/jenkins.yaml
  # (see scripts/install-jenkins.sh) so the YAML lives in exactly one file,
  # not duplicated here. Our configScripts defines its own top-level
  # `jenkins.securityRealm` / `jenkins.authorizationStrategy`, which the
  # chart's own JCasC.defaultConfig defaults explicitly defer to (see the
  # chart's own values.yaml comment: "Ignored if securityRealm is defined
  # in controller.JCasC.configScripts").
  # defaultConfig: false - the chart's own baseline JCasC fragment
  # duplicates keys our configScripts.main already sets in full
  # (numExecutors, mode, even its own "kubernetes" cloud pointing at the
  # same jenkinsUrl/tunnel) and JCasC hard-errors on ANY key defined in
  # two sources, even with identical values (confirmed against a real
  # cluster: "ConfiguratorConflictException: Found conflicting
  # configuration... numExecutors"). jenkins/jcasc/jenkins.yaml is
  # already a complete, self-sufficient config - security realm,
  # authorization, the Kubernetes cloud + both pod templates, global env,
  # and the seed job - so it becomes the single source of truth instead.
  JCasC:
    defaultConfig: false
    configScripts: {}

  # Non-secret configuration only - real credentials come from a K8s
  # Secret (see jenkins/secrets/jenkins-admin-credentials.secret.example.yaml)
  # referenced by secretKeyRef below, never as plaintext values here.
  containerEnv:
    - name: ADMIN_USER
      valueFrom:
        secretKeyRef: { name: jenkins-admin-credentials, key: admin-user }
    - name: ADMIN_PASSWORD
      valueFrom:
        secretKeyRef: { name: jenkins-admin-credentials, key: admin-password }
    - name: GIT_REPO_URL
      value: "https://github.com/REPLACE_ME_ORG/REPLACE_ME_REPO.git"
    - name: GIT_CREDENTIALS_ID
      value: ""   # set to a Jenkins credential ID if the repo is private (see README)
    - name: ECR_REGISTRY
      value: "REPLACE_ME_ACCOUNT_ID.dkr.ecr.REPLACE_ME_REGION.amazonaws.com"
    - name: ECR_REPO_PREFIX
      value: "erez-cv-devops"
    - name: AWS_REGION
      value: "eu-west-1"
    - name: CD_TARGET_NAMESPACE
      value: "devops-app"
    - name: HELM_CHART_PATH
      value: "k8s/helm/cv-platform"
    - name: HELM_RELEASE_NAME
      value: "cv-platform"
    - name: JENKINS_URL
      # Cosmetic only (build-badge/email links). Matches the default
      # port-forward access path; update by hand if you turn ingress.enabled
      # on below and give Jenkins a real hostname.
      value: "http://localhost:8080/"

  # readinessProbe/livenessProbe are chart defaults (HTTP GET /login) -
  # kept explicit here per the task's "bonus" checklist.
  probes:
    startupProbe:
      httpGet: { path: "/login", port: "http" }
      failureThreshold: 12
      periodSeconds: 10
    livenessProbe:
      httpGet: { path: "/login", port: "http" }
      periodSeconds: 10
      failureThreshold: 5
    readinessProbe:
      httpGet: { path: "/login", port: "http" }
      periodSeconds: 10
      failureThreshold: 3

  serviceType: ClusterIP   # never LoadBalancer - see "Accessing the Jenkins UI" in jenkins/README.md
  servicePort: 8080

  # Ingress is OFF by default: the safest posture is that Jenkins is not
  # reachable from outside the cluster at all, and the README's default
  # access path is `kubectl port-forward`. Flip this on only if you also
  # set an nginx.ingress.kubernetes.io/whitelist-source-range annotation
  # and configure TLS (cert-manager/ACM) - see jenkins/README.md
  # "Exposing the UI" for the fully-worked alternative.
  ingress:
    enabled: false
    ingressClassName: "nginx"
    hostName: "jenkins.cv.example.com"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/whitelist-source-range: "REPLACE_ME_CIDR/32"

  javaOpts: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

  # The chart's default "live JCasC reload" sidecar watches ConfigMaps via
  # the Kubernetes API, which would require granting jenkins-controller's
  # ServiceAccount configmaps get/list/watch - a permission
  # jenkins/rbac/controller-role.yaml deliberately does not grant (see its
  # comment). We don't need live reload: jenkins/scripts/configure-
  # jenkins.sh already re-runs `helm upgrade`, which restarts the
  # StatefulSet and re-reads JCasC on boot - so this stays off to keep the
  # controller's RBAC footprint as small as possible.
  sidecars:
    configAutoReload:
      enabled: false

# We manage the ServiceAccount + Role + RoleBinding ourselves as plain,
# reviewable manifests in jenkins/rbac/ (applied by scripts/install-
# jenkins.sh BEFORE this Helm release) - both `create: false` here so the
# chart uses that pre-existing ServiceAccount/RBAC instead of trying to
# render (and then failing to "adopt") its own same-named copies.
# NOTE: these are top-level keys in this chart, NOT nested under `controller:`.
serviceAccount:
  create: false
  name: "jenkins-controller"

rbac:
  create: false

persistence:
  enabled: true
  storageClass: "gp3"   # matches k8s/pvc.yaml's StorageClass choice for this project; override at install time for non-EBS clusters (see install-jenkins.sh)
  size: "8Gi"
  accessMode: "ReadWriteOnce"

# Dynamic agents ONLY - no statically-provisioned "default" agent pool.
# Every agent Pod comes from the Kubernetes cloud + templates defined in
# jenkins/jcasc/jenkins.yaml, not from this chart's built-in agent.* values.
agent:
  enabled: false

# The chart also supports its own Kubernetes-plugin sidecar config
# (`controller.sidecars`, `agent.*`) - unused here on purpose, since
# jenkins/jcasc/jenkins.yaml already defines the Kubernetes cloud and both
# pod templates in full, with our hardened securityContext. Keeping agent
# provisioning in one place (JCasC) avoids two competing sources of truth.
