---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common Linux packages
  ansible.builtin.apt:
    name:
      - curl
      - unzip
      - git
      - vim
      - htop
      - ca-certificates
      - gnupg
      - python3
      - python3-pip
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create app root folder
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
