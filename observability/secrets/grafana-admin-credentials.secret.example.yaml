# EXAMPLE ONLY - never apply this file as-is, never commit the real one.
# observability/scripts/install-observability.sh generates the real Secret
# with a random password (or reads GRAFANA_ADMIN_PASSWORD from your shell
# env if you set one) and applies it directly - it is never written to a
# file, let alone Git. See observability/README.md "Creating observability
# secrets".
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_ME_WITH_A_REAL_SECRET_VALUE
