# Grafana's two auto-provisioned datasources (see
# observability/helm/values.yaml grafana.sidecar.datasources) need to reach
# both Prometheus (queries/dashboards) and Alertmanager (the "Alerting"
# datasource) over their native ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus-alertmanager
  namespace: observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["prometheus", "alertmanager"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
