# See backend-servicemonitor.yaml for the full rationale (identical pattern).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker
  namespace: observability
  labels:
    app.kubernetes.io/part-of: erez-cv-devops
spec:
  namespaceSelector:
    matchNames: ["devops-app", "devops-app-dev"]
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
